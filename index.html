<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Javv's Digibooth</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      background: #fef0f8;
      color: #333;
      overflow: hidden;
    }

    .sidebar {
      width: 220px;
      background: #f8d2e4;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .color-customizer {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffe1f2;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .color-customizer i {
      font-size: 36px;
      color: #ff1493;
      margin-bottom: 8px;
    }

    .color-customizer label {
      font-weight: bold;
      color: #ff1493;
      margin-bottom: 5px;
    }

    .color-customizer input[type="color"] {
      width: 80px;
      height: 40px;
      border: none;
      cursor: pointer;
    }

    .main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      position: relative;
    }

    h1,
    .footer-title {
      font-family: 'Great Vibes', cursive;
      font-weight: 300;
      font-style: italic;
    }

    h1 {
      margin-top: 20px;
      font-size: 2.5em;
      color: black;
    }

    video {
      width: 100%;
      max-width: 500px;
      border-radius: 10px;
      border: 2px solid #ff69b4;
    }

    .controls {
      margin: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 12px 24px;
      font-size: 1em;
      background-color: #ff69b4;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.1);
    }

    #countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5em;
      color: white;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
      display: none;
      z-index: 100;
      opacity: 0;
      animation: none;
    }

    @keyframes countdownAnimation {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    }

    .result-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      padding: 20px;
      align-items: flex-start;
    }

    .photo-strip-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-strip {
      background: white;
      padding: 15px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #ff69b4;
      position: relative;
      min-height: 400px;
      width: 210px;
    }

    .photo-strip img {
      width: 180px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 3px solid #ff69b4;
    }

    .strip-watermark {
      font-family: 'Great Vibes', cursive;
      font-size: 1.8em;
      color: #ff69b4;
      margin-top: auto;
      padding-top: 10px;
      text-align: center;
      opacity: 0.7;
    }

    .customizer {
      background: #ffe1f2;
      padding: 15px;
      border-radius: 12px;
      min-width: 200px;
    }

    .customizer label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #ff1493;
    }

    .emoji-container, .sticker-container {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .emoji, .sticker {
      font-size: 24px;
      cursor: grab;
      user-select: none;
    }

    .draggable-item {
      position: absolute;
      font-size: 24px;
      cursor: move;
      user-select: none;
      z-index: 10;
    }

    .text-editor {
      margin-top: 10px;
    }

    .text-editor input {
      width: 100%;
      padding: 5px;
      margin-bottom: 5px;
    }

    .filter-container {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .strip-buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .action-icons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }

    .action-icons i {
      font-size: 30px;
      cursor: pointer;
      color: #ff69b4;
      transition: transform 0.2s ease;
    }

    .action-icons i:hover {
      transform: scale(1.1);
    }

    .footer-title {
      font-size: 1.5em;
      color: black;
      text-align: center;
      margin-top: 20px;
    }

    .flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.3s;
    }

    .flash.active {
      opacity: 0.8;
    }

    .camera-switch {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .camera-switch i {
      font-size: 20px;
    }

    .timer-options {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .timer-options button {
      padding: 8px 12px;
      font-size: 0.9em;
    }

    .timer-options button.active {
      background-color: #ff1493;
    }

    .photo-count-options {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .photo-count-options button {
      padding: 8px 12px;
      font-size: 0.9em;
    }

    .photo-count-options button.active {
      background-color: #ff1493;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <label for="stripStyle">Strip Layout</label>
    <select id="stripStyle">
      <option value="vertical">Vertical</option>
      <option value="horizontal">Horizontal</option>
    </select>

    <div class="color-customizer">
      <i class="fas fa-palette"></i>
      <label for="photoStripColor">Strip Color</label>
      <input type="color" id="photoStripColor" value="#ffffff" />
      <button onclick="applyStripColor()">Apply Color</button>
    </div>

    <div class="timer-options">
      <label>Timer:</label>
      <button onclick="setTimer(3)" class="active">3s</button>
      <button onclick="setTimer(5)">5s</button>
      <button onclick="setTimer(10)">10s</button>
    </div>

    <div class="photo-count-options">
      <label>Photos:</label>
      <button onclick="setPhotoCount(1)">1</button>
      <button onclick="setPhotoCount(3)" class="active">3</button>
      <button onclick="setPhotoCount(5)">5</button>
    </div>
  </div>

  <div class="main">
    <h1>Javv's Digibooth</h1>
    <div style="position: relative; display: inline-block;">
      <video id="video" autoplay playsinline></video>
      <button class="camera-switch" onclick="switchCamera()">
        <i class="fas fa-camera-retro"></i>
      </button>
      <div id="countdown">3</div>
      <div class="flash" id="flash"></div>
    </div>

    <div class="filter-container">
      <label><input type="checkbox" id="grayscale"> Grayscale</label>
      <label><input type="checkbox" id="sepia"> Sepia</label>
      <label><input type="checkbox" id="vintage"> Vintage</label>
      <label><input type="checkbox" id="invert"> Invert</label>
    </div>

    <div class="controls">
      <button onclick="startPhotoSession()">Start Digiboothing!!</button>
    </div>

    <div class="result-container" id="resultContainer" style="display: none;">
      <div class="photo-strip-container">
        <div id="result" class="photo-strip" ondragover="event.preventDefault()" ondrop="dropItem(event)">
          <div class="strip-watermark">Javv's Digibooth</div>
        </div>
      </div>

      <div class="customizer">
        <label>Emoji Customizer</label>
        <div class="emoji-container">
          <div class="emoji" draggable="true" ondragstart="startDrag(event)">🌸</div>
          <div class="emoji" draggable="true" ondragstart="startDrag(event)">✨</div>
          <div class="emoji" draggable="true" ondragstart="startDrag(event)">😂</div>
          <div class="emoji" draggable="true" ondragstart="startDrag(event)">❤️</div>
          <div class="emoji" draggable="true" ondragstart="startDrag(event)">🎉</div>
          <div class="emoji" draggable="true" ondragstart="startDrag(event)">😍</div>
        </div>

        <label>Text Editor</label>
        <div class="text-editor">
          <input type="text" id="customText" placeholder="Add your message..." />
          <input type="color" id="textColor" value="#ff1493">
          <button onclick="addTextToStrip()">Add Text</button>
        </div>

        <label>Stickers</label>
        <div class="sticker-container">
          <div class="sticker" draggable="true" ondragstart="startDrag(event)">🎩</div>
          <div class="sticker" draggable="true" ondragstart="startDrag(event)">👓</div>
          <div class="sticker" draggable="true" ondragstart="startDrag(event)">👨‍🦰</div>
          <div class="sticker" draggable="true" ondragstart="startDrag(event)">🎀</div>
          <div class="sticker" draggable="true" ondragstart="startDrag(event)">🎈</div>
          <div class="sticker" draggable="true" ondragstart="startDrag(event)">🎂</div>
        </div>

        <button onclick="saveToGallery()">Save to Gallery</button>
        <button onclick="shareOnSocial()">Share</button>
      </div>
    </div>

    <div class="strip-buttons" style="display:none;" id="stripButtons">
      <button onclick="downloadStrip()">Download</button>
      <button onclick="startPhotoSession()">Retake</button>
    </div>

    <div class="action-icons">
      <i class="fas fa-download" onclick="downloadStrip()" title="Download Photo Strip"></i>
      <i class="fas fa-redo" onclick="startPhotoSession()" title="Retake Photos"></i>
    </div>

    <div class="footer-title">Javv's Digibooth</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const video = document.getElementById("video");
    const countdown = document.getElementById("countdown");
    const strip = document.getElementById("result");
    const resultContainer = document.getElementById("resultContainer");
    const grayscale = document.getElementById("grayscale");
    const sepia = document.getElementById("sepia");
    const vintage = document.getElementById("vintage");
    const invert = document.getElementById("invert");
    const stripButtons = document.getElementById("stripButtons");
    const flash = document.getElementById("flash");
    const colorPicker = document.getElementById("photoStripColor");
    let images = [];
    let photoSessionActive = false;
    let currentStream = null;
    let facingMode = "user"; // Default to front camera
    let countdownSeconds = 3;
    let photoCount = 3;
    let currentPhotoIndex = 0;

    // Initialize camera
    function initCamera() {
      stopCameraStream();
      
      const constraints = {
        video: { 
          facingMode: facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };
      
      navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => {
          currentStream = stream;
          video.srcObject = stream;
        })
        .catch(err => {
          console.error("Camera error: ", err);
          alert("Camera access is needed!");
        });
    }

    function stopCameraStream() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
    }

    function switchCamera() {
      facingMode = facingMode === "user" ? "environment" : "user";
      initCamera();
    }

    function setTimer(seconds) {
      countdownSeconds = seconds;
      document.querySelectorAll('.timer-options button').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    function setPhotoCount(count) {
      photoCount = count;
      document.querySelectorAll('.photo-count-options button').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    function applyStripColor() {
      const selectedColor = colorPicker.value;
      
      // Change background color of the photo strip
      strip.style.backgroundColor = selectedColor;
      
      // Change border color to be slightly darker
      const borderColor = shadeColor(selectedColor, -20);
      strip.style.borderColor = borderColor;
      
      // Update all images' border colors
      const images = strip.querySelectorAll('img');
      images.forEach(img => {
        img.style.borderColor = borderColor;
      });
      
      // Update watermark color to be slightly darker
      const watermark = document.querySelector('.strip-watermark');
      watermark.style.color = borderColor;
    }

    // Helper function to darken/lighten colors
    function shadeColor(color, percent) {
      let R = parseInt(color.substring(1,3), 16);
      let G = parseInt(color.substring(3,5), 16);
      let B = parseInt(color.substring(5,7), 16);

      R = parseInt(R * (100 + percent) / 100);
      G = parseInt(G * (100 + percent) / 100);
      B = parseInt(B * (100 + percent) / 100);

      R = (R<255)?R:255;  
      G = (G<255)?G:255;  
      B = (B<255)?B:255;  

      R = Math.round(R);
      G = Math.round(G);
      B = Math.round(B);

      const RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
      const GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
      const BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));

      return "#"+RR+GG+BB;
    }

    function startPhotoSession() {
      if (photoSessionActive) return;
      photoSessionActive = true;
      
      images = [];
      currentPhotoIndex = 0;
      resultContainer.style.display = "none";
      stripButtons.style.display = "none";
      strip.innerHTML = "";
      
      // Add watermark back when clearing the strip
      const watermark = document.createElement("div");
      watermark.className = "strip-watermark";
      watermark.textContent = "Javv's Digibooth";
      strip.appendChild(watermark);
      
      // Apply current color selection
      applyStripColor();
      
      // Scroll to top to see the countdown
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
      
      // Start countdown for first photo
      startCountdown(countdownSeconds, () => {
        capturePhoto();
      });
    }

    function startCountdown(seconds, callback) {
      countdown.style.display = "block";
      countdown.innerText = seconds;
      countdown.style.animation = "none";
      void countdown.offsetWidth; // Trigger reflow
      countdown.style.animation = "countdownAnimation 1s forwards";
      
      if (seconds > 0) {
        setTimeout(() => {
          startCountdown(seconds - 1, callback);
        }, 1000);
      } else {
        setTimeout(() => {
          countdown.style.display = "none";
          callback();
        }, 500);
      }
    }

    function capturePhoto() {
      // Flash effect
      flash.classList.add("active");
      setTimeout(() => {
        flash.classList.remove("active");
      }, 200);
      
      // Apply filters before capturing
      const filters = [];
      if (grayscale.checked) filters.push("grayscale(100%)");
      if (sepia.checked) filters.push("sepia(80%)");
      if (vintage.checked) filters.push("contrast(1.1) brightness(1.1) saturate(1.1)");
      if (invert.checked) filters.push("invert(100%)");
      
      const originalFilter = video.style.filter;
      video.style.filter = filters.join(" ");
      
      // Capture photo
      html2canvas(video).then(canvas => {
        video.style.filter = originalFilter; // Reset filter
        
        const img = new Image();
        img.src = canvas.toDataURL();
        img.onload = () => {
          images.push(img);
          addImageToStrip(img);
          currentPhotoIndex++;
          
          // Take the specified number of photos with countdown between each
          if (currentPhotoIndex < photoCount) {
            setTimeout(() => {
              startCountdown(countdownSeconds, () => {
                capturePhoto();
              });
            }, 1000);
          } else {
            // Session complete
            resultContainer.style.display = "flex";
            stripButtons.style.display = "flex";
            photoSessionActive = false;
            
            // Auto-scroll to the result after all photos are taken
            setTimeout(() => {
              resultContainer.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
              });
            }, 300);
          }
        };
      });
    }

    function addImageToStrip(img) {
      const imgElement = document.createElement("img");
      imgElement.src = img.src;
      imgElement.style.border = "3px solid #ff69b4";
      imgElement.style.borderRadius = "6px";
      
      // Create container for image
      const container = document.createElement("div");
      container.style.marginBottom = "10px";
      container.style.position = "relative";
      
      // Insert before the watermark
      const watermark = strip.querySelector('.strip-watermark');
      strip.insertBefore(container, watermark);
      container.appendChild(imgElement);
      
      // Update border color to match current strip color
      const currentColor = colorPicker.value;
      const borderColor = shadeColor(currentColor, -20);
      imgElement.style.borderColor = borderColor;
    }

    function startDrag(event) {
      const offsetX = event.clientX - event.target.getBoundingClientRect().left;
      const offsetY = event.clientY - event.target.getBoundingClientRect().top;
      event.dataTransfer.setData("text/plain", event.target.innerHTML);
      event.dataTransfer.setData("offsetX", offsetX);
      event.dataTransfer.setData("offsetY", offsetY);
    }

    function dropItem(event) {
      event.preventDefault();
      const droppedItem = event.dataTransfer.getData("text/plain");
      const offsetX = parseFloat(event.dataTransfer.getData("offsetX"));
      const offsetY = parseFloat(event.dataTransfer.getData("offsetY"));
      
      const div = document.createElement("div");
      div.className = "draggable-item";
      div.textContent = droppedItem;
      div.style.left = `${event.clientX - strip.getBoundingClientRect().left - offsetX}px`;
      div.style.top = `${event.clientY - strip.getBoundingClientRect().top - offsetY}px`;
      
      // Make the new item draggable
      div.draggable = true;
      div.addEventListener("dragstart", startDrag);
      
      // Insert before the watermark
      const watermark = strip.querySelector('.strip-watermark');
      strip.insertBefore(div, watermark);
    }

    function addTextToStrip() {
      const textInput = document.getElementById("customText");
      const textColor = document.getElementById("textColor").value;
      
      if (!textInput.value.trim()) return;
      
      const div = document.createElement("div");
      div.className = "draggable-item";
      div.textContent = textInput.value;
      div.style.left = `${Math.random() * 150}px`;
      div.style.top = `${Math.random() * 350}px`;
      div.style.color = textColor;
      div.style.fontWeight = "bold";
      div.style.fontSize = "20px";
      
      // Make the text draggable
      div.draggable = true;
      div.addEventListener("dragstart", startDrag);
      
      // Insert before the watermark
      const watermark = strip.querySelector('.strip-watermark');
      strip.insertBefore(div, watermark);
      
      textInput.value = "";
    }

    function downloadStrip() {
      html2canvas(strip).then(canvas => {
        const link = document.createElement("a");
        link.download = "javvs_digibooth.png";
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    function saveToGallery() {
      alert("Saved to your gallery!");
    }

    function shareOnSocial() {
      if (navigator.share) {
        html2canvas(strip).then(canvas => {
          canvas.toBlob(function(blob) {
            const file = new File([blob], "digibooth.png", { type: "image/png" });
            navigator.share({
              title: 'My Digibooth Creation',
              text: 'Check out my photo from Javv\'s Digibooth!',
              files: [file]
            }).catch(err => {
              console.log('Error sharing:', err);
              alert("Sharing failed. You can download the image instead.");
            });
          }, 'image/png');
        });
      } else {
        alert("Web Share API not supported in your browser. You can download the image instead.");
      }
    }

    // Initialize camera on load
    window.addEventListener('load', initCamera);
    
    // Clean up camera stream when page is unloaded
    window.addEventListener('beforeunload', stopCameraStream);
  </script>
</body>
</html>
